<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyChatBox</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#f1f3f6;
    color:#111827;
}

button{
    border:0;
    border-radius:9px;
    padding:11px 14px;
    background:#4f46e5;
    color:white;
    cursor:pointer;
    font-size:14px;
}

button:hover{
    opacity:.9;
}

input,textarea{
    width:100%;
    padding:11px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font-size:14px;
    outline:none;
}

input:focus,textarea:focus{
    border-color:#4f46e5;
}

/* LOGIN */

.login{
    width:360px;
    max-width:92%;
    margin:90px auto;
    background:white;
    padding:30px;
    border-radius:18px;
    box-shadow:0 8px 30px #d1d5db;
}

.login h1{
    text-align:center;
    color:#4f46e5;
    margin-bottom:8px;
}

.login .sub{
    text-align:center;
    color:#6b7280;
    margin-bottom:20px;
    font-size:13px;
}

.login input{
    margin-bottom:9px;
}

.login button{
    width:100%;
    margin-top:8px;
}

.forgot{
    background:transparent !important;
    color:#4f46e5 !important;
    font-size:13px;
    padding:8px;
}

/* MAIN */

#chatPage{
    display:none;
    width:94%;
    max-width:1100px;
    height:90vh;
    margin:5vh auto;
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 8px 30px #d1d5db;
}

/* HEADER */

.header{
    height:62px;
    background:#4f46e5;
    color:white;
    padding:12px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.header-left{
    display:flex;
    flex-direction:column;
    gap:2px;
}

.header-title{
    font-size:18px;
    font-weight:bold;
}

.header-id{
    font-size:11px;
    opacity:.85;
}

.header button{
    background:white;
    color:#4f46e5;
    margin-left:5px;
}

/* CHAT CONTAINER */

.chat-container{
    display:flex;
    height:calc(100% - 62px);
}

/* SIDEBAR */

.sidebar{
    width:34%;
    border-right:1px solid #e5e7eb;
    background:#fafafa;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.sidebar-top{
    padding:12px;
    border-bottom:1px solid #e5e7eb;
}

.tabs{
    display:flex;
    gap:6px;
    margin-bottom:10px;
}

.tab{
    flex:1;
    background:#e5e7eb;
    color:#374151;
    padding:9px 5px;
}

.tab.active{
    background:#4f46e5;
    color:white;
}

.section-title{
    font-size:13px;
    font-weight:bold;
    margin:8px 0;
}

.search{
    margin-top:10px;
}

.list{
    overflow-y:auto;
    flex:1;
}

/* USER */

.user{
    padding:11px 13px;
    border-bottom:1px solid #eee;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:9px;
}

.user:hover{
    background:#eef2ff;
}

.user.selected{
    background:#e0e7ff;
}

.avatar{
    width:35px;
    height:35px;
    border-radius:50%;
    background:#4f46e5;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:bold;
    flex:none;
}

.user-info{
    min-width:0;
}

.user-name{
    font-weight:bold;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.user-meta{
    font-size:11px;
    color:#6b7280;
    margin-top:2px;
}

.empty{
    padding:25px 15px;
    text-align:center;
    color:#6b7280;
    font-size:13px;
}

/* CHAT */

.chat{
    width:66%;
    display:flex;
    flex-direction:column;
}

.chat-header{
    padding:13px 16px;
    border-bottom:1px solid #e5e7eb;
    font-weight:bold;
    min-height:55px;
}

.chat-header small{
    display:block;
    color:#6b7280;
    font-weight:normal;
    margin-top:3px;
}

.messages{
    flex:1;
    padding:18px;
    overflow-y:auto;
    background:#f8fafc;
}

.message{
    padding:9px 13px;
    margin:8px 0;
    border-radius:13px;
    background:white;
    width:fit-content;
    max-width:75%;
    box-shadow:0 1px 4px #e5e7eb;
}

.my-message{
    margin-left:auto;
    background:#4f46e5;
    color:white;
}

.message-time{
    font-size:9px;
    opacity:.65;
    margin-top:4px;
}

.message-actions{
    font-size:10px;
    margin-top:5px;
    opacity:.8;
}

.message-actions span{
    cursor:pointer;
    margin-right:8px;
    text-decoration:underline;
}

/* SEND */

.send-area{
    display:flex;
    padding:10px;
    border-top:1px solid #e5e7eb;
    gap:8px;
}

.send-area input{
    margin:0;
}

.send-area button{
    width:85px;
}

.no-chat{
    margin:auto;
    color:#6b7280;
    text-align:center;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    align-items:center;
    justify-content:center;
    padding:15px;
    z-index:20;
}

.modal-box{
    background:white;
    width:400px;
    max-width:100%;
    padding:22px;
    border-radius:16px;
}

.modal-box h2{
    margin-bottom:15px;
}

.modal-box label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin:10px 0 5px;
}

.modal-actions{
    display:flex;
    gap:8px;
    margin-top:15px;
}

.modal-actions button{
    flex:1;
}

.secondary{
    background:#e5e7eb;
    color:#111827;
}

.request-actions{
    display:flex;
    gap:6px;
    margin-top:7px;
}

.request-actions button{
    padding:7px 9px;
    font-size:12px;
}

.badge{
    background:#ef4444;
    color:white;
    border-radius:99px;
    padding:2px 7px;
    font-size:10px;
    margin-left:4px;
}

@media(max-width:700px){

    #chatPage{
        width:100%;
        height:100vh;
        margin:0;
        border-radius:0;
    }

    .sidebar{
        width:38%;
    }

    .chat{
        width:62%;
    }

    .user{
        padding:10px 7px;
    }

    .user-meta{
        font-size:9px;
    }

    .header-title{
        font-size:15px;
    }

    .message{
        max-width:88%;
    }
}
</style>
</head>

<body>

<!-- LOGIN PAGE -->

<div class="login" id="loginPage">

    <h1>💬 MyChatBox</h1>

    <div class="sub">
        Connect. Chat. Stay Connected.
    </div>

    <input
        type="email"
        id="email"
        placeholder="Enter email"
    >

    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="login()">
        Login
    </button>

    <button onclick="signup()">
        Create Account
    </button>

    <button
        class="forgot"
        onclick="forgotPassword()"
    >
        Forgot Password?
    </button>

</div>


<!-- CHAT PAGE -->

<div id="chatPage">

    <div class="header">

        <div class="header-left">

            <div class="header-title">
                💬 MyChatBox
            </div>

            <div
                class="header-id"
                id="myIdText"
            >
                My ID: loading...
            </div>

        </div>

        <div>

            <button onclick="openProfile()">
                👤 Profile
            </button>

            <button onclick="logout()">
                Logout
            </button>

        </div>

    </div>


    <div class="chat-container">

        <!-- SIDEBAR -->

        <div class="sidebar">

            <div class="sidebar-top">

                <div class="tabs">

                    <button
                        class="tab active"
                        id="friendsTab"
                        onclick="showTab('friends')"
                    >
                        👥 Friends
                    </button>

                    <button
                        class="tab"
                        id="requestsTab"
                        onclick="showTab('requests')"
                    >
                        📨 Requests

                        <span
                            id="requestBadge"
                            class="badge"
                            style="display:none"
                        >
                            0
                        </span>

                    </button>

                </div>


                <div id="friendsControls">

                    <div class="section-title">
                        ➕ Add Friend by MyChatBox ID
                    </div>

                    <div style="display:flex;gap:6px">

                        <input
                            id="friendIdInput"
                            placeholder="Example: MCB123456"
                        >

                        <button onclick="sendFriendRequest()">
                            Add
                        </button>

                    </div>


                    <input
                        class="search"
                        id="searchUsers"
                        placeholder="🔎 Search your friends..."
                        oninput="filterFriends()"
                    >

                </div>

            </div>


            <div
                class="list"
                id="usersList"
            >
                <div class="empty">
                    Loading...
                </div>
            </div>

        </div>


        <!-- CHAT -->

        <div class="chat">

            <div
                class="chat-header"
                id="chatHeader"
            >
                Select a friend to chat
            </div>


            <div
                class="messages"
                id="messages"
            >

                <div class="no-chat">
                    👈 Add a friend and select them to start chatting.
                </div>

            </div>


            <div class="send-area">

                <input
                    id="messageInput"
                    placeholder="Type a message..."
                    onkeypress="handleEnter(event)"
                >

                <button onclick="sendMessage()">
                    Send
                </button>

            </div>

        </div>

    </div>

</div>


<!-- PROFILE MODAL -->

<div
    class="modal"
    id="profileModal"
>

    <div class="modal-box">

        <h2>
            👤 My Profile
        </h2>

        <label>
            MyChatBox ID
        </label>

        <input
            id="profileId"
            readonly
        >

        <label>
            Name
        </label>

        <input
            id="profileName"
            placeholder="Your name"
        >

        <label>
            Bio
        </label>

        <textarea
            id="profileBio"
            rows="3"
            placeholder="Write something about yourself..."
        ></textarea>

        <div class="modal-actions">

            <button onclick="saveProfile()">
                Save
            </button>

            <button
                class="secondary"
                onclick="closeProfile()"
            >
                Close
            </button>

        </div>

    </div>

</div>


<!-- FIREBASE -->

<script type="module">

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
    getAuth,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    onAuthStateChanged,
    sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    getFirestore,
    collection,
    addDoc,
    query,
    where,
    orderBy,
    onSnapshot,
    serverTimestamp,
    getDocs,
    updateDoc,
    deleteDoc,
    doc
}
from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

    apiKey:
        "AIzaSyB-6OqLo9Hk_KydMV30uzthd7X1x5PBlcs",

    authDomain:
        "mychatbox-b3c99.firebaseapp.com",

    projectId:
        "mychatbox-b3c99",

    storageBucket:
        "mychatbox-b3c99.firebasestorage.app",

    messagingSenderId:
        "152288209919",

    appId:
        "1:152288209919:web:763bef9165a07e47c3d5ca",

    measurementId:
        "G-WNW33F1NXP"
};


/* START FIREBASE */

const app =
    initializeApp(firebaseConfig);

const auth =
    getAuth(app);

const db =
    getFirestore(app);


/* VARIABLES */

let currentProfile = null;

let selectedUser = null;

let unsubscribeFriends = null;

let unsubscribeRequests = null;

let unsubscribeMessages = null;

let allFriends = [];


/* FORGOT PASSWORD */

window.forgotPassword =
async function(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    if(!email){

        alert(
            "Pehle apna email enter karo."
        );

        return;

    }


    try{

        await sendPasswordResetEmail(
            auth,
            email
        );


        alert(
            "Password reset link tumhare email par bhej diya gaya hai. 📧\n\nInbox ke saath Spam/Junk folder bhi check kar lena."
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* CREATE RANDOM ID */

function makePublicId(){

    return "MCB" +
        Math.floor(
            100000 +
            Math.random() * 900000
        );

}


/* CHECK UNIQUE ID */

async function createUniquePublicId(){

    for(let i = 0; i < 10; i++){

        const id =
            makePublicId();


        const q =
            query(
                collection(db,"users"),
                where(
                    "publicId",
                    "==",
                    id
                )
            );


        const snap =
            await getDocs(q);


        if(snap.empty){

            return id;

        }

    }


    throw new Error(
        "Could not create unique ID. Try again."
    );

}


/* GET CURRENT USER PROFILE */

async function getMyUserDoc(){

    const user =
        auth.currentUser;


    if(!user){

        return null;

    }


    const q =
        query(
            collection(db,"users"),
            where(
                "uid",
                "==",
                user.uid
            )
        );


    const snap =
        await getDocs(q);


    if(snap.empty){

        return null;

    }


    const d =
        snap.docs[0];


    return {

        id:d.id,

        ...d.data()

    };

}


/* CREATE / UPDATE PROFILE */

async function ensureMyProfile(){

    const user =
        auth.currentUser;


    if(!user){

        return;

    }


    let profile =
        await getMyUserDoc();


    if(!profile){

        const publicId =
            await createUniquePublicId();


        const ref =
            await addDoc(
                collection(db,"users"),
                {

                    uid:user.uid,

                    email:user.email,

                    name:
                        user.email.split("@")[0],

                    bio:"",

                    publicId:publicId,

                    online:true,

                    createdAt:
                        serverTimestamp()

                }
            );


        profile = {

            id:ref.id,

            uid:user.uid,

            email:user.email,

            name:
                user.email.split("@")[0],

            bio:"",

            publicId:publicId,

            online:true

        };

    }

    else{

        const updates = {};


        if(!profile.publicId){

            updates.publicId =
                await createUniquePublicId();

        }


        if(!profile.name){

            updates.name =
                user.email.split("@")[0];

        }


        updates.online = true;


        if(
            Object.keys(updates).length
        ){

            await updateDoc(
                doc(
                    db,
                    "users",
                    profile.id
                ),
                updates
            );


            profile = {

                ...profile,

                ...updates

            };

        }

    }


    currentProfile =
        profile;


    document.getElementById(
        "myIdText"
    ).innerText =
        "My ID: " +
        profile.publicId;

}


/* SIGNUP */

window.signup =
async function(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    if(!email || !password){

        alert(
            "Enter email and password."
        );

        return;

    }


    if(password.length < 6){

        alert(
            "Password must be at least 6 characters."
        );

        return;

    }


    try{

        const result =
            await createUserWithEmailAndPassword(
                auth,
                email,
                password
            );


        const publicId =
            await createUniquePublicId();


        await addDoc(
            collection(db,"users"),
            {

                uid:result.user.uid,

                email:email,

                name:
                    email.split("@")[0],

                bio:"",

                publicId:publicId,

                online:true,

                createdAt:
                    serverTimestamp()

            }
        );


        alert(
            "Account created 🎉\n\nYour MyChatBox ID is:\n" +
            publicId
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* LOGIN */

window.login =
async function(){

    const email =
        document.getElementById(
            "email"
        ).value.trim();


    const password =
        document.getElementById(
            "password"
        ).value;


    if(!email || !password){

        alert(
            "Enter email and password."
        );

        return;

    }


    try{

        await signInWithEmailAndPassword(
            auth,
            email,
            password
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* LOGOUT */

window.logout =
async function(){

    try{

        if(currentProfile){

            await updateDoc(
                doc(
                    db,
                    "users",
                    currentProfile.id
                ),
                {
                    online:false
                }
            );

        }

    }

    catch(error){}


    await signOut(auth);

};


/* AUTH STATE */

onAuthStateChanged(
    auth,
    async function(user){

        if(user){

            document.getElementById(
                "loginPage"
            ).style.display =
                "none";


            document.getElementById(
                "chatPage"
            ).style.display =
                "block";


            try{

                await ensureMyProfile();

                loadFriends();

                loadRequests();

            }

            catch(error){

                alert(
                    error.message
                );

            }

        }

        else{

            document.getElementById(
                "loginPage"
            ).style.display =
                "block";


            document.getElementById(
                "chatPage"
            ).style.display =
                "none";


            selectedUser = null;

            currentProfile = null;

        }

    }
);


/* FIND USER BY ID */

async function findUserByPublicId(
    publicId
){

    const q =
        query(
            collection(db,"users"),
            where(
                "publicId",
                "==",
                publicId
            )
        );


    const snap =
        await getDocs(q);


    if(snap.empty){

        return null;

    }


    const d =
        snap.docs[0];


    return {

        id:d.id,

        ...d.data()

    };

}


/* CHECK FRIENDSHIP */

async function areFriends(
    uid1,
    uid2
){

    const q =
        query(
            collection(db,"friendships"),
            where(
                "members",
                "array-contains",
                uid1
            )
        );


    const snap =
        await getDocs(q);


    return snap.docs.some(
        function(d){

            const members =
                d.data().members || [];


            return members.includes(
                uid2
            );

        }
    );

}


/* SEND FRIEND REQUEST */

window.sendFriendRequest =
async function(){

    const input =
        document.getElementById(
            "friendIdInput"
        );


    const publicId =
        input.value
            .trim()
            .toUpperCase();


    if(!publicId){

        alert(
            "Enter a MyChatBox ID."
        );

        return;

    }


    if(!currentProfile){

        return;

    }


    if(
        publicId ===
        currentProfile.publicId
    ){

        alert(
            "You cannot add yourself."
        );

        return;

    }


    try{

        const target =
            await findUserByPublicId(
                publicId
            );


        if(!target){

            alert(
                "User not found. Check the MyChatBox ID."
            );

            return;

        }


        if(
            await areFriends(
                currentProfile.uid,
                target.uid
            )
        ){

            alert(
                "You are already friends."
            );

            return;

        }


        const existing1 =
            query(
                collection(
                    db,
                    "friendRequests"
                ),

                where(
                    "fromUid",
                    "==",
                    currentProfile.uid
                ),

                where(
                    "toUid",
                    "==",
                    target.uid
                ),

                where(
                    "status",
                    "==",
                    "pending"
                )
            );


        const existing2 =
            query(
                collection(
                    db,
                    "friendRequests"
                ),

                where(
                    "fromUid",
                    "==",
                    target.uid
                ),

                where(
                    "toUid",
                    "==",
                    currentProfile.uid
                ),

                where(
                    "status",
                    "==",
                    "pending"
                )
            );


        const results =
            await Promise.all([
                getDocs(existing1),
                getDocs(existing2)
            ]);


        if(!results[0].empty){

            alert(
                "Friend request already sent."
            );

            return;

        }


        if(!results[1].empty){

            alert(
                "This user has already sent you a request. Open Requests."
            );

            return;

        }


        await addDoc(
            collection(
                db,
                "friendRequests"
            ),
            {

                fromUid:
                    currentProfile.uid,

                fromName:
                    currentProfile.name,

                fromEmail:
                    currentProfile.email,

                fromPublicId:
                    currentProfile.publicId,

                toUid:
                    target.uid,

                toName:
                    target.name ||
                    target.email.split("@")[0],

                toEmail:
                    target.email,

                status:
                    "pending",

                createdAt:
                    serverTimestamp()

            }
        );


        input.value = "";


        alert(
            "Friend request sent ✅"
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* LOAD REQUESTS */

function loadRequests(){

    if(unsubscribeRequests){

        unsubscribeRequests();

    }


    const q =
        query(
            collection(
                db,
                "friendRequests"
            ),

            where(
                "toUid",
                "==",
                currentProfile.uid
            ),

            where(
                "status",
                "==",
                "pending"
            )
        );


    unsubscribeRequests =
        onSnapshot(
            q,
            function(snapshot){

                const badge =
                    document.getElementById(
                        "requestBadge"
                    );


                badge.innerText =
                    snapshot.size;


                badge.style.display =
                    snapshot.size
                    ? "inline-block"
                    : "none";


                if(
                    document
                    .getElementById(
                        "requestsTab"
                    )
                    .classList
                    .contains("active")
                ){

                    renderRequests(
                        snapshot
                    );

                }

            }
        );

}


/* RENDER REQUESTS */

function renderRequests(
    snapshot
){

    const list =
        document.getElementById(
            "usersList"
        );


    list.innerHTML = "";


    if(snapshot.empty){

        list.innerHTML =
            '<div class="empty">No pending friend requests.</div>';

        return;

    }


    snapshot.forEach(
        function(d){

            const r =
                d.data();


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "user";


            div.innerHTML = `

                <div class="avatar">
                    ${(r.fromName || "U")
                        .charAt(0)
                        .toUpperCase()}
                </div>

                <div class="user-info">

                    <div class="user-name">
                        ${escapeHtml(
                            r.fromName ||
                            r.fromEmail
                        )}
                    </div>

                    <div class="user-meta">
                        ${escapeHtml(
                            r.fromPublicId || ""
                        )}
                    </div>

                    <div class="request-actions">

                        <button
                            onclick="acceptRequest('${d.id}')"
                        >
                            Accept
                        </button>

                        <button
                            class="secondary"
                            onclick="rejectRequest('${d.id}')"
                        >
                            Reject
                        </button>

                    </div>

                </div>

            `;


            list.appendChild(
                div
            );

        }
    );

}


/* ACCEPT REQUEST */

window.acceptRequest =
async function(requestId){

    try{

        const requestRef =
            doc(
                db,
                "friendRequests",
                requestId
            );


        const requestQuery =
            query(
                collection(
                    db,
                    "friendRequests"
                ),

                where(
                    "__name__",
                    "==",
                    requestId
                )
            );


        const requestSnap =
            await getDocs(
                requestQuery
            );


        if(requestSnap.empty){

            return;

        }


        const request =
            requestSnap
            .docs[0]
            .data();


        await addDoc(
            collection(
                db,
                "friendships"
            ),
            {

                members:[

                    currentProfile.uid,

                    request.fromUid

                ],

                createdAt:
                    serverTimestamp()

            }
        );


        await updateDoc(
            requestRef,
            {
                status:"accepted"
            }
        );


        alert(
            "Friend added ✅"
        );


        showTab("friends");

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* REJECT REQUEST */

window.rejectRequest =
async function(requestId){

    try{

        await updateDoc(
            doc(
                db,
                "friendRequests",
                requestId
            ),

            {
                status:"rejected"
            }
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* LOAD FRIENDS */

function loadFriends(){

    if(unsubscribeFriends){

        unsubscribeFriends();

    }


    const q =
        query(
            collection(
                db,
                "friendships"
            ),

            where(
                "members",
                "array-contains",
                currentProfile.uid
            )
        );


    unsubscribeFriends =
        onSnapshot(
            q,
            async function(snapshot){

                const users = [];


                for(
                    const d of snapshot.docs
                ){

                    const members =
                        d.data().members || [];


                    const otherUid =
                        members.find(
                            function(x){

                                return x !==
                                    currentProfile.uid;

                            }
                        );


                    if(!otherUid){

                        continue;

                    }


                    const uq =
                        query(
                            collection(
                                db,
                                "users"
                            ),

                            where(
                                "uid",
                                "==",
                                otherUid
                            )
                        );


                    const us =
                        await getDocs(uq);


                    if(!us.empty){

                        const ud =
                            us.docs[0];


                        users.push({

                            id:ud.id,

                            ...ud.data(),

                            friendshipId:
                                d.id

                        });

                    }

                }


                allFriends =
                    users;


                renderFriends(
                    users
                );

            }
        );

}


/* RENDER FRIENDS */

function renderFriends(
    users
){

    const list =
        document.getElementById(
            "usersList"
        );


    list.innerHTML = "";


    if(!users.length){

        list.innerHTML =
            '<div class="empty">No friends yet.<br><br>Use a MyChatBox ID above to add someone.</div>';

        return;

    }


    users.forEach(
        function(user){

            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "user";


            div.dataset.search =
                (
                    (user.name || "") +
                    " " +
                    (user.email || "") +
                    " " +
                    (user.publicId || "")
                ).toLowerCase();


            div.innerHTML = `

                <div class="avatar">
                    ${(user.name || user.email)
                        .charAt(0)
                        .toUpperCase()}
                </div>

                <div class="user-info">

                    <div class="user-name">
                        ${escapeHtml(
                            user.name ||
                            user.email
                        )}
                    </div>

                    <div class="user-meta">

                        ${
                            user.online
                            ? "🟢 Online"
                            : "⚫ Offline"
                        }

                        ·

                        ${escapeHtml(
                            user.publicId || ""
                        )}

                    </div>

                </div>

            `;


            div.onclick =
                function(){

                    selectUser(
                        user,
                        div
                    );

                };


            list.appendChild(
                div
            );

        }
    );

}


/* SEARCH FRIENDS */

window.filterFriends =
function(){

    const term =
        document.getElementById(
            "searchUsers"
        ).value.toLowerCase();


    document
        .querySelectorAll(
            "#usersList .user"
        )
        .forEach(
            function(el){

                el.style.display =
                    el.dataset.search &&
                    el.dataset.search.includes(
                        term
                    )
                    ? "flex"
                    : "none";

            }
        );

};


/* TABS */

window.showTab =
function(tab){

    const friendsTab =
        document.getElementById(
            "friendsTab"
        );


    const requestsTab =
        document.getElementById(
            "requestsTab"
        );


    if(tab === "friends"){

        friendsTab.classList.add(
            "active"
        );

        requestsTab.classList.remove(
            "active"
        );


        document.getElementById(
            "friendsControls"
        ).style.display =
            "block";


        renderFriends(
            allFriends
        );

    }

    else{

        friendsTab.classList.remove(
            "active"
        );

        requestsTab.classList.add(
            "active"
        );


        document.getElementById(
            "friendsControls"
        ).style.display =
            "none";


        const q =
            query(
                collection(
                    db,
                    "friendRequests"
                ),

                where(
                    "toUid",
                    "==",
                    currentProfile.uid
                ),

                where(
                    "status",
                    "==",
                    "pending"
                )
            );


        getDocs(q)
            .then(
                renderRequests
            );

    }

};


/* SELECT FRIEND */

function selectUser(
    user,
    element
){

    selectedUser =
        user;


    document
        .querySelectorAll(
            ".user"
        )
        .forEach(
            function(item){

                item.classList.remove(
                    "selected"
                );

            }
        );


    element.classList.add(
        "selected"
    );


    document.getElementById(
        "chatHeader"
    ).innerHTML =

        "💬 " +

        escapeHtml(
            user.name ||
            user.email
        ) +

        "<small>" +

        (
            user.online
            ? "🟢 Online"
            : "⚫ Offline"
        ) +

        " · " +

        escapeHtml(
            user.publicId || ""
        ) +

        "</small>";


    loadMessages();

}


/* LOAD MESSAGES */

function loadMessages(){

    if(
        !selectedUser ||
        !currentProfile
    ){

        return;

    }


    if(unsubscribeMessages){

        unsubscribeMessages();

    }


    const box =
        document.getElementById(
            "messages"
        );


    box.innerHTML = "";


    const q =
        query(

            collection(
                db,
                "messages"
            ),

            where(
                "participants",
                "array-contains",
                currentProfile.uid
            ),

            orderBy(
                "createdAt",
                "asc"
            )

        );


    unsubscribeMessages =
        onSnapshot(
            q,
            function(snapshot){

                box.innerHTML = "";


                snapshot.forEach(
                    function(d){

                        const data =
                            d.data();


                        const mine =
                            data.senderId ===
                            currentProfile.uid
                            &&
                            data.receiverId ===
                            selectedUser.uid;


                        const theirs =
                            data.senderId ===
                            selectedUser.uid
                            &&
                            data.receiverId ===
                            currentProfile.uid;


                        if(
                            !mine &&
                            !theirs
                        ){

                            return;

                        }


                        const div =
                            document.createElement(
                                "div"
                            );


                        div.className =
                            "message" +
                            (
                                mine
                                ? " my-message"
                                : ""
                            );


                        const time =
                            data.createdAt &&
                            data.createdAt.toDate

                            ? data.createdAt
                                .toDate()
                                .toLocaleTimeString(
                                    [],
                                    {
                                        hour:"2-digit",
                                        minute:"2-digit"
                                    }
                                )

                            : "";


                        div.innerHTML = `

                            <div>
                                ${escapeHtml(
                                    data.text || ""
                                )}
                            </div>

                            <div class="message-time">
                                ${time}
                            </div>

                            ${
                                mine
                                ?
                                `
                                <div class="message-actions">

                                    <span
                                        onclick="editMessage(
                                            '${d.id}',
                                            ${JSON.stringify(
                                                data.text || ""
                                            )}
                                        )"
                                    >
                                        Edit
                                    </span>

                                    <span
                                        onclick="deleteMessage(
                                            '${d.id}'
                                        )"
                                    >
                                        Delete
                                    </span>

                                </div>
                                `
                                :
                                ""
                            }

                        `;


                        box.appendChild(
                            div
                        );

                    }
                );


                if(
                    !box.children.length
                ){

                    box.innerHTML =
                        '<div class="no-chat">Say hello 👋</div>';

                }


                box.scrollTop =
                    box.scrollHeight;

            }
        );

}


/* SEND MESSAGE */

window.sendMessage =
async function(){

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text){

        return;

    }


    if(!selectedUser){

        alert(
            "First add/select a friend."
        );

        return;

    }


    if(
        !(await areFriends(
            currentProfile.uid,
            selectedUser.uid
        ))
    ){

        alert(
            "You can only chat with friends."
        );

        return;

    }


    try{

        await addDoc(
            collection(
                db,
                "messages"
            ),
            {

                text:text,

                senderId:
                    currentProfile.uid,

                sender:
                    currentProfile.email,

                receiverId:
                    selectedUser.uid,

                receiver:
                    selectedUser.email,

                participants:[

                    currentProfile.uid,

                    selectedUser.uid

                ],

                createdAt:
                    serverTimestamp()

            }
        );


        input.value = "";

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* EDIT MESSAGE */

window.editMessage =
async function(
    messageId,
    oldText
){

    const newText =
        prompt(
            "Edit your message:",
            oldText
        );


    if(newText === null){

        return;

    }


    const text =
        newText.trim();


    if(!text){

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "messages",
                messageId
            ),

            {
                text:text,
                edited:true
            }
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* DELETE MESSAGE */

window.deleteMessage =
async function(
    messageId
){

    if(
        !confirm(
            "Delete this message?"
        )
    ){

        return;

    }


    try{

        await deleteDoc(
            doc(
                db,
                "messages",
                messageId
            )
        );

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* ENTER */

window.handleEnter =
function(event){

    if(
        event.key ===
        "Enter"
    ){

        sendMessage();

    }

};


/* PROFILE */

window.openProfile =
async function(){

    if(!currentProfile){

        return;

    }


    document.getElementById(
        "profileId"
    ).value =
        currentProfile.publicId || "";


    document.getElementById(
        "profileName"
    ).value =
        currentProfile.name || "";


    document.getElementById(
        "profileBio"
    ).value =
        currentProfile.bio || "";


    document.getElementById(
        "profileModal"
    ).style.display =
        "flex";

};


/* CLOSE PROFILE */

window.closeProfile =
function(){

    document.getElementById(
        "profileModal"
    ).style.display =
        "none";

};


/* SAVE PROFILE */

window.saveProfile =
async function(){

    const name =
        document.getElementById(
            "profileName"
        ).value.trim();


    const bio =
        document.getElementById(
            "profileBio"
        ).value.trim();


    if(!name){

        alert(
            "Enter your name."
        );

        return;

    }


    try{

        await updateDoc(
            doc(
                db,
                "users",
                currentProfile.id
            ),

            {
                name:name,
                bio:bio
            }
        );


        currentProfile = {

            ...currentProfile,

            name:name,

            bio:bio

        };


        closeProfile();


        alert(
            "Profile saved ✅"
        );


        loadFriends();

    }

    catch(error){

        alert(
            error.message
        );

    }

};


/* ESCAPE HTML */

function escapeHtml(value){

    return String(value)

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
