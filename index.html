<!-- SETTINGS PAGE -->
<div id="settingsPage" class="settings-page">

  <div class="settings-header">
    <button class="settings-back" onclick="closeSettings()">
      ←
    </button>

    <div>
      <h2>Settings</h2>
      <p>Control your MyChatBox features</p>
    </div>
  </div>

  <div class="settings-card">

    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-icon">🔔</div>
        <div>
          <h3>Notifications</h3>
          <p>Show new message and friend request notifications</p>
        </div>
      </div>

      <label class="switch">
        <input
          type="checkbox"
          id="settingNotifications"
          onchange="toggleSetting('notifications', this.checked)"
        >
        <span class="slider"></span>
      </label>
    </div>


    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-icon">⌨️</div>
        <div>
          <h3>Typing Indicator</h3>
          <p>Show when your friend is typing</p>
        </div>
      </div>

      <label class="switch">
        <input
          type="checkbox"
          id="settingTyping"
          onchange="toggleSetting('typing', this.checked)"
        >
        <span class="slider"></span>
      </label>
    </div>


    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-icon">🔎</div>
        <div>
          <h3>Enhanced Search</h3>
          <p>Search users by name, ID, email and bio</p>
        </div>
      </div>

      <label class="switch">
        <input
          type="checkbox"
          id="settingSearch"
          onchange="toggleSetting('enhancedSearch', this.checked)"
        >
        <span class="slider"></span>
      </label>
    </div>


    <div class="setting-item">
      <div class="setting-info">
        <div class="setting-icon">📌</div>
        <div>
          <h3>Pin Messages</h3>
          <p>Pin important messages in your chats</p>
        </div>
      </div>

      <label class="switch">
        <input
          type="checkbox"
          id="settingPin"
          onchange="toggleSetting('pinMessages', this.checked)"
        >
        <span class="slider"></span>
      </label>
    </div>

  </div>

</div>
